<form role="search" aria-label="Search input example" (ngSubmit)="search()">
  <nx-formfield>
    <input
      nxInput
      type="search"
      name="searchTerm"
      placeholder="Enter Keyword"
      aria-label="Search term"
      [(ngModel)]="searchTerm"
    />
    <span nxFormfieldPrefix>
      <nx-icon name="search" size="s" aria-hidden="true"></nx-icon>
    </span>
    <button nxFormfieldAppendix nxButton="primary medium" type="submit">
      Search
    </button>
  </nx-formfield>
</form>

@if (submittedTerm()) {
  <p>Searching for: {{ submittedTerm() }}</p>
}
