<nx-tab-group (tabClose)="confirmClose($event.index)">
  @for (tab of tabs; track tab) {
    <nx-tab [label]="tab.label" [closable]="true">
      <p class="tab__content">Content of {{ tab.label }}</p>
    </nx-tab>
  }
</nx-tab-group>

<ng-template #confirmTemplate>
  <div nxModalContent>
    <h3 nxHeadline="subsection-medium" class="nx-modal-margin-bottom">
      Do you want to close {{ pendingLabel }}?
    </h3>
    <p nxCopytext="small">This tab will be removed.</p>
  </div>

  <div nxModalActions>
    <button
      nxButton="secondary"
      size="s"
      type="button"
      class="nx-margin-right-s"
      (click)="handleClick(false)"
    >
      Keep tab
    </button>
    <button
      nxButton="danger"
      size="s"
      type="button"
      (click)="handleClick(true)"
    >
      Close tab
    </button>
  </div>
</ng-template>
