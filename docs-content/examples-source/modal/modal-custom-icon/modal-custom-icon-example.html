<button
  nxButton
  class="nx-margin-right-xs nx-margin-bottom-m"
  (click)="open(template)"
>
  Open modal with custom icon
</button>
<button nxButton class="nx-margin-bottom-m" (click)="open(inlineTemplate)">
  Open modal with icon in front of heading
</button>

<ng-template #template>
  <h2 nxModalTitle>
    <nx-icon name="certificate-papers" size="2xl" aria-hidden="true"></nx-icon>
    Modal heading
  </h2>
  <div nxModalContent>
    <p nxCopytext="small" class="nx-modal-margin-bottom">
      This content is placed within the <code>nx-modal-container</code>
    </p>
  </div>
  <div nxModalActions>
    <button
      (click)="dialogRef?.close()"
      class="nx-margin-bottom-0 nx-margin-right-xs"
      nxButton="small secondary"
      type="button"
    >
      Cancel
    </button>
    <button
      class="nx-margin-bottom-0"
      nxButton="small"
      type="button"
      (click)="dialogRef?.close()"
    >
      Proceed
    </button>
  </div>
</ng-template>

<ng-template #inlineTemplate>
  <h2 nxModalTitle class="custom-icon-title--inline">
    <nx-icon name="certificate-papers" size="2xl" aria-hidden="true"></nx-icon>
    Modal heading
  </h2>
  <div nxModalContent>
    <p nxCopytext="small" class="nx-modal-margin-bottom">
      This content is placed within the <code>nx-modal-container</code>
    </p>
  </div>
  <div nxModalActions>
    <button
      (click)="dialogRef?.close()"
      class="nx-margin-bottom-0 nx-margin-right-xs"
      nxButton="small secondary"
      type="button"
    >
      Cancel
    </button>
    <button
      class="nx-margin-bottom-0"
      nxButton="small"
      type="button"
      (click)="dialogRef?.close()"
    >
      Proceed
    </button>
  </div>
</ng-template>
