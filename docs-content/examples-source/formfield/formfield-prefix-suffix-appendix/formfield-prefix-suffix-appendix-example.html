<nx-formfield label="Your share (Suffix)">
  <input
    nxInput
    nxAriaLabel="Enter percents"
    min="0"
    max="100"
    type="number"
    value="85"
  />
  <span nxFormfieldSuffix>%</span>
</nx-formfield>

<nx-formfield label="Your settings (Appendix)">
  <input nxInput />
  <button
    nxFormfieldAppendix
    nxIconButton="tertiary small"
    type="button"
    aria-label="Open settings"
  >
    <nx-icon name="setting" size="s" aria-hidden="true"> </nx-icon>
  </button>
</nx-formfield>
