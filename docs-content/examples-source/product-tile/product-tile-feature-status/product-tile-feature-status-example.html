<nx-product-tile-group
  aria-label="Choose your car insurance"
  [(value)]="selectedProduct"
>
  @for (product of products; track product.value) {
    <nx-product-tile [value]="product.value">
      <span nxProductTileTitle>{{ product.title }}</span>
      <nx-price nxProductTilePrice [value]="product.price" prefix="from" />

      <ul nxList>
        @for (feature of features; track feature) {
          @if (product.included.includes(feature)) {
            <li nxListIcon="check">
              <span class="cdk-visually-hidden">Included: </span>{{ feature }}
            </li>
          } @else {
            <li nxListIcon="close" class="example__excluded">
              <span class="cdk-visually-hidden">Not included: </span
              >{{ feature }}
            </li>
          }
        }
      </ul>

      <button nxProductTileSelectButton type="button"></button>
    </nx-product-tile>
  }
</nx-product-tile-group>
