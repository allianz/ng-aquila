<div class="inverse">
  <div class="row">
    <span class="row-label">Plain</span>
    @for (type of types; track type) {
    <!-- use inverse on dark / inverse surfaces -->
    <nx-status-icon [type]="type" size="l" inverse></nx-status-icon>
    }
  </div>
  <div class="row">
    <span class="row-label">Contained</span>
    @for (type of types; track type) {
    <nx-status-icon [type]="type" size="l" contained inverse></nx-status-icon>
    }
  </div>
</div>
