<nx-switcher [(ngModel)]="inverse">Inverse</nx-switcher>

<div class="grid" [class.grid--inverse]="inverse()">
  <span></span>
  @for (size of sizes; track size) {
    <span class="header" [class.inverse-label]="inverse()">{{ size }}</span>
  }
  @for (type of types; track type) {
    <span [class.inverse-label]="inverse()">{{ type }}</span>
    @for (size of sizes; track size) {
      <span>
        <!-- type can be "success", "warning", "info", "error" -->
        <!-- size can be "s", "m", "l", "xl", "2xl" -->
        <nx-status-icon
          [type]="type"
          [size]="size"
          contained
          [inverse]="inverse()"
        ></nx-status-icon>
      </span>
    }
  }
</div>
