<nx-context-menu #menuWithProvider="nxContextMenu">
  <nx-context-menu-group label="Actions">
    <button nxContextMenuItem type="button">Settings</button>
    <button nxContextMenuItem type="button">Download</button>
  </nx-context-menu-group>
  <nx-divider />
  <nx-context-menu-group label="Edit">
    <button nxContextMenuItem type="button">Undo</button>
    <button nxContextMenuItem type="button">Redo</button>
    <button nxContextMenuItem type="button">
      <nx-icon aria-hidden="true" name="cut"></nx-icon>Cut
    </button>
    <button nxContextMenuItem type="button">
      <nx-icon aria-hidden="true" name="duplicate"></nx-icon>
      Copy
    </button>
    <button nxContextMenuItem type="button">Paste</button>
    <button
      nxContextMenuItem
      [nxContextMenuTriggerFor]="copyAsSubMenu"
      type="button"
    >
      <nx-icon aria-hidden="true" name="download"></nx-icon>
      Copy As
    </button>
  </nx-context-menu-group>
  <nx-divider />
  <nx-context-menu-group label="More">
    <button
      nxContextMenuItem
      [nxContextMenuTriggerFor]="openWithSubMenu"
      type="button"
    >
      Open With
    </button>
    <button nxContextMenuItem type="button">Properties</button>
  </nx-context-menu-group>
</nx-context-menu>

<nx-context-menu #copyAsSubMenu="nxContextMenu">
  <button nxContextMenuItem type="button">CSS</button>
  <button nxContextMenuItem type="button">SVG</button>
  <button nxContextMenuItem type="button">PNG</button>
</nx-context-menu>

<nx-context-menu #openWithSubMenu="nxContextMenu">
  <button nxContextMenuItem type="button">Editor</button>
  <button nxContextMenuItem type="button">Browser</button>
</nx-context-menu>

<button
  nxIconButton="tertiary small"
  [nxContextMenuTriggerFor]="menuWithProvider"
  aria-label="Open menu"
  type="button"
>
  <nx-icon aria-hidden="true" name="ellipsis-h"></nx-icon>
</button>
