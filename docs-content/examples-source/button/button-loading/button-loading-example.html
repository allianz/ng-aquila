<div class="button-container">
  <nx-switcher [(ngModel)]="loading"
    >{{ loading() ? 'Unset loading' : 'Set loading' }}
  </nx-switcher>
  <nx-switcher [(ngModel)]="inverse"
    >{{ inverse() ? 'Unset inverse' : 'Set inverse' }}
  </nx-switcher>
  <nx-formfield label="Size">
    <nx-dropdown [(ngModel)]="size" [options]="sizeOptions"></nx-dropdown>
  </nx-formfield>
</div>

@let loadingLabel = 'Saving Form';
<div class="button-container" [class.docs-inverse-container]="inverse()">
  <button
    [nxButton]="`primary ${size()}`"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Primary
  </button>
  <button
    [nxButton]="`secondary ${size()}`"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Secondary
  </button>
  <button
    [nxButton]="`tertiary ${size()}`"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Tertiary
  </button>
  <button
    [nxButton]="`emphasis ${size()}`"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Emphasis
  </button>
  <button
    [nxButton]="`attention ${size()}`"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Attention
  </button>
  <button
    [nxButton]="`cta ${size()}`"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Call To Action
  </button>

  <button
    [nxIconButton]="size()"
    [inverse]="inverse()"
    type="button"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : 'Icon Button'"
  >
    <nx-icon name="plus"></nx-icon>
  </button>

  <button
    nxPlainButton
    [inverse]="inverse()"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Plain
  </button>

  <button
    type="button"
    [nxButton]="`primary danger ${size()}`"
    [inverse]="inverse()"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Primary Danger
  </button>
  <button
    type="button"
    [nxButton]="`secondary danger ${size()}`"
    [inverse]="inverse()"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Secondary Danger
  </button>
  <button
    type="button"
    [nxButton]="`tertiary danger ${size()}`"
    [inverse]="inverse()"
    [loading]="loading()"
    [attr.aria-label]="loading() ? loadingLabel : null"
  >
    Tertiary Danger
  </button>
</div>
