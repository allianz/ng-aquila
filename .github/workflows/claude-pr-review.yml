name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    uses: ilt/actions/.github/workflows/reusable-claude-pr-review.yml@v1
    with:
      model: eu.anthropic.claude-opus-4-8
    secrets: inherit
