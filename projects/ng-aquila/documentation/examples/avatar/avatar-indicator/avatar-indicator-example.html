<div class="container">
  <button
    nxAvatar
    size="s"
    aria-label="Mercedes Deutsch"
    class="nx-margin-right-s"
  >
    <span aria-hidden="true">MD</span>
    <nx-indicator nxAvatarIndicator>
      <nx-icon name="chevron-left" aria-hidden="true"></nx-icon>
    </nx-indicator>
  </button>

  <button
    nxAvatar
    size="m"
    aria-label="Mercedes Deutsch"
    class="nx-margin-right-s"
  >
    <span aria-hidden="true">MD</span>
    <nx-indicator nxAvatarIndicator type="positive">
      <nx-icon name="chevron-left" aria-hidden="true"></nx-icon>
    </nx-indicator>
  </button>

  <button nxAvatar size="l" aria-label="user" class="nx-margin-right-s">
    <nx-icon name="user-o" aria-hidden="true"></nx-icon>
    <nx-indicator nxAvatarIndicator type="warning">
      <nx-icon name="chevron-left" aria-hidden="true"></nx-icon
    ></nx-indicator>
  </button>

  <button nxAvatar size="xl" aria-label="user">
    <nx-icon name="user-o" aria-hidden="true"></nx-icon>
    <nx-indicator nxAvatarIndicator type="info">
      <nx-icon name="chevron-left" aria-hidden="true"></nx-icon
    ></nx-indicator>
  </button>
</div>
