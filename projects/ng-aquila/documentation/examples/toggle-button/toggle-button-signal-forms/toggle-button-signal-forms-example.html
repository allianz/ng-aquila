<nx-toggle-button-group [formField]="paymentForm.interval">
  <nx-label>Payment interval</nx-label>
  @for (item of intervals; track item.value) {
    <nx-toggle-button [value]="item.value">{{ item.label }}</nx-toggle-button>
  }
  <nx-error>Please choose a payment interval</nx-error>
</nx-toggle-button-group>

<p>Value: {{ model().interval || '-' }}</p>
<p>Touched: {{ paymentForm.interval().touched() }}</p>
<p>Valid: {{ paymentForm.interval().valid() }}</p>
