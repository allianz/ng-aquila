<form [formGroup]="testForm">
  <nx-slider name="reactiveTest" formControlName="sliderTestReactive">
    <nx-label>Please choose a number</nx-label>
    <nx-error>Please choose at least 40.</nx-error>
  </nx-slider>
  <p>Form value: {{ testForm.value | json }}</p>
  <p>Form status: {{ testForm.status | json }}</p>
  <button nxButton="secondary small" type="submit">Submit</button>
</form>
