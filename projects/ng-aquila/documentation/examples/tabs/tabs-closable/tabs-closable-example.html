<nx-tab-group (tabClose)="closeTab($event.index)">
  @for (tab of tabs; track tab) {
    <nx-tab [label]="tab.label" [closable]="true" [disabled]="tab.disabled">
      <p class="tab__content">Content of {{ tab.label }}</p>
    </nx-tab>
  }
</nx-tab-group>

<button nxButton size="small" (click)="resetTabs()">Reset Tabs</button>
