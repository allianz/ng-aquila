<button
  nxIconButton="tertiary small"
  [nxContextMenuTriggerFor]="menu"
  aria-label="Show or hide products"
  type="button"
  class="nx-margin-bottom-s"
>
  <nx-icon aria-hidden="true" name="ellipsis-h"></nx-icon>
</button>

<nx-context-menu #menu="nxContextMenu">
  @for (title of productTitles; track title; let i = $index) {
    @if (i !== selectedColumnIndex) {
      <button nxContextMenuItem type="button" (click)="toggleHiddenIndex(i)">
        <nx-icon
          aria-hidden="true"
          [name]="isHidden(i) ? 'password-hide-o' : 'password-show-o'"
        ></nx-icon>
        {{ title }}
      </button>
    }
  }
</nx-context-menu>

<div class="container">
  <nx-comparison-table
    [selectedIndex]="selectedColumnIndex"
    (selectedIndexChange)="selectedColumnIndex = $event"
    [hiddenIndexes]="hiddenIndexes"
  >
    <ng-container nxComparisonTableRow type="header">
      <nx-comparison-table-cell type="header" [disabledColumn]="true">
        <nx-comparison-table-header-title>
          <h3 nxHeadline>Product One</h3>
        </nx-comparison-table-header-title>
        <nx-comparison-table-header-price>
          <nx-price [value]="105.99" currency="EUR"></nx-price>
        </nx-comparison-table-header-price>
        <button
          nxComparisonTableSelectButton
          unselectedLabel="Sold out"
          selectedLabel="Selected"
          type="button"
        ></button>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell type="header">
        <nx-comparison-table-header-title>
          <h3 nxHeadline>Product Two</h3>
        </nx-comparison-table-header-title>
        <nx-comparison-table-header-price>
          <nx-price [value]="110.99" currency="EUR"></nx-price>
        </nx-comparison-table-header-price>
        <button
          nxComparisonTableSelectButton
          unselectedLabel="Select"
          selectedLabel="Selected"
          type="button"
        ></button>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell type="header">
        <nx-comparison-table-header-title>
          <h3 nxHeadline>Product Three</h3>
        </nx-comparison-table-header-title>
        <nx-comparison-table-header-price>
          <nx-price [value]="115.99" currency="EUR"></nx-price>
        </nx-comparison-table-header-price>
        <button
          nxComparisonTableSelectButton
          unselectedLabel="Select"
          selectedLabel="Selected"
          type="button"
        ></button>
      </nx-comparison-table-cell>
    </ng-container>

    <ng-container nxComparisonTableRow>
      <nx-comparison-table-description-cell
        >Coverage amount</nx-comparison-table-description-cell
      >
      <nx-comparison-table-cell>100 Mio. Euro</nx-comparison-table-cell>
      <nx-comparison-table-cell>150 Mio. Euro</nx-comparison-table-cell>
      <nx-comparison-table-cell>200 Mio. Euro</nx-comparison-table-cell>
    </ng-container>

    <ng-container nxComparisonTableRow>
      <nx-comparison-table-description-cell
        >Add-on</nx-comparison-table-description-cell
      >
      <!-- disabledColumn does not reach form controls — disable them yourself. -->
      <nx-comparison-table-cell>
        <nx-checkbox [disabled]="true">Include</nx-checkbox>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell>
        <nx-checkbox>Include</nx-checkbox>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell>
        <nx-checkbox>Include</nx-checkbox>
      </nx-comparison-table-cell>
    </ng-container>
  </nx-comparison-table>
</div>
