<nx-comparison-table selectedIndex="1">
  <ng-container nxComparisonTableRow type="header">
    <nx-comparison-table-cell type="header">
      <nx-comparison-table-header-title>
        <h3 nxHeadline>Product One</h3>
      </nx-comparison-table-header-title>
      <nx-comparison-table-header-price>
        <nx-price [value]="105.99" currency="EUR"></nx-price>
      </nx-comparison-table-header-price>
      <button
        nxComparisonTableSelectButton
        unselectedLabel="Select"
        selectedLabel="Selected"
        type="button"
      ></button>
    </nx-comparison-table-cell>
    <nx-comparison-table-cell type="header">
      <nx-comparison-table-header-title>
        <h3 nxHeadline>Product Two</h3>
      </nx-comparison-table-header-title>
      <nx-comparison-table-header-price>
        <nx-price [value]="110.99" currency="EUR"></nx-price>
      </nx-comparison-table-header-price>
      <button
        nxComparisonTableSelectButton
        unselectedLabel="Select"
        selectedLabel="Selected"
        type="button"
      ></button>
    </nx-comparison-table-cell>
    <nx-comparison-table-cell type="header">
      <nx-comparison-table-header-title>
        <h3 nxHeadline>Product Three</h3>
      </nx-comparison-table-header-title>
      <nx-comparison-table-header-price>
        <nx-price [value]="115.99" currency="EUR"></nx-price>
      </nx-comparison-table-header-price>
      <button
        nxComparisonTableSelectButton
        unselectedLabel="Select"
        selectedLabel="Selected"
        type="button"
      ></button>
    </nx-comparison-table-cell>
  </ng-container>

  <ng-container
    nxComparisonTableRowGroup
    visibleRows="2"
    useFullRowForExpandableArea="true"
  >
    <ng-container nxComparisonTableRow>
      <nx-comparison-table-description-cell
        >Service headline
      </nx-comparison-table-description-cell>
      <nx-comparison-table-cell>
        <nx-icon name="minus" size="s" aria-label="Not included"></nx-icon>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell>
        <nx-icon
          name="check"
          size="s"
          aria-label="Included"
          class="check-icon"
        ></nx-icon>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell>
        <nx-icon
          name="check"
          size="s"
          aria-label="Included"
          class="check-icon"
        ></nx-icon>
      </nx-comparison-table-cell>
    </ng-container>

    <ng-container nxComparisonTableRow>
      <nx-comparison-table-description-cell
        >Service headline
      </nx-comparison-table-description-cell>
      <nx-comparison-table-cell>
        <nx-icon name="minus" size="s" aria-label="Not included"></nx-icon>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell>
        <nx-icon
          name="check"
          size="s"
          aria-label="Included"
          class="check-icon"
        ></nx-icon>
      </nx-comparison-table-cell>
      <nx-comparison-table-cell>
        <nx-icon
          name="check"
          size="s"
          aria-label="Included"
          class="check-icon"
        ></nx-icon>
      </nx-comparison-table-cell>
    </ng-container>

    <ng-container nxComparisonTableRow>
      <nx-comparison-table-description-cell
        >Service headline
      </nx-comparison-table-description-cell>
      <nx-comparison-table-cell>100 Mio. Euro </nx-comparison-table-cell>
      <nx-comparison-table-cell>150 Mio. Euro </nx-comparison-table-cell>
      <nx-comparison-table-cell>200 Mio. Euro </nx-comparison-table-cell>
    </ng-container>

    <ng-container nxComparisonTableRow>
      <nx-comparison-table-description-cell
        >Service headline
      </nx-comparison-table-description-cell>
      <nx-comparison-table-cell>100 Mio. Euro </nx-comparison-table-cell>
      <nx-comparison-table-cell>150 Mio. Euro </nx-comparison-table-cell>
      <nx-comparison-table-cell>200 Mio. Euro </nx-comparison-table-cell>
    </ng-container>
  </ng-container>

  <ng-container nxComparisonTableRow type="footer">
    <nx-comparison-table-cell>
      <button
        nxComparisonTableSelectButton
        unselectedLabel="Select"
        selectedLabel="Selected"
        class="nx-margin-bottom-s"
        type="button"
      ></button>
      <p class="product-underline">Some short information</p>
    </nx-comparison-table-cell>
    <nx-comparison-table-cell>
      <button
        nxComparisonTableSelectButton
        unselectedLabel="Select"
        selectedLabel="Selected"
        class="nx-margin-bottom-s"
        type="button"
      ></button>
      <p class="product-underline">Some short information</p>
    </nx-comparison-table-cell>
    <nx-comparison-table-cell>
      <button
        nxComparisonTableSelectButton
        unselectedLabel="Select"
        selectedLabel="Selected"
        class="nx-margin-bottom-s"
        type="button"
      ></button>
      <p class="product-underline">Some short information</p>
    </nx-comparison-table-cell>
  </ng-container>
</nx-comparison-table>
