<nx-radio-toggle [readonly]="true">
  <nx-radio-toggle-button value="A" [selected]="true"
    >Label A</nx-radio-toggle-button
  >
  <nx-radio-toggle-button value="B">Label B</nx-radio-toggle-button>
</nx-radio-toggle>
<br />

<h3>Readonly Inverse</h3>

<div class="docs-inverse-container">
  <nx-radio-toggle [readonly]="true" inverse>
    <nx-radio-toggle-button value="A" [selected]="true"
      >Label A</nx-radio-toggle-button
    >
    <nx-radio-toggle-button value="B">Label B</nx-radio-toggle-button>
  </nx-radio-toggle>
</div>
