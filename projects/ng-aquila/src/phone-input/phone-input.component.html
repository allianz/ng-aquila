<div class="nx-phone-input___wrapper">
  <div class="nx-phone-input___country" [class.hide]="readonly && !disabled">
    <nx-dropdown
      [value]="countryCode"
      #dropdown
      [showFilter]="true"
      [disabled]="disabled"
      [required]="required"
      [overlayLabel]="areaCodeLabel"
      (valueChange)="_onCountryChange($event)"
      [options]="_sortedCountries"
      [overlayFallbackOrigin]="dropdown"
      (focusOut)="_onInputBlur()"
      (focus)="_onInputFocus()"
      [panelGrow]="true"
      [attr.aria-label]="areaCodeLabel"
      ariaLabelledBy=""
    >
      <span *nxClosedLabel>+{{ _getCallingCode(dropdown.value) }}</span>
    </nx-dropdown>

    <!-- Shown when no country is selected, e.g. after a programmatic value that couldn't
    be parsed into a calling code.  -->
    @if (!countryCode) {
      <nx-icon name="globe" class="nx-phone-input___globe" aria-hidden="true"></nx-icon>
    }
  </div>

  <!-- adding c-input for the styles and to not get the overhead of the nxInput directive -->
  <input
    #numberInput
    class="c-input"
    [class.hide]="readonly && !disabled"
    type="tel"
    (blur)="_onInputBlur()"
    (focus)="_onInputFocus()"
    [(ngModel)]="_inputValue"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="_onInput()"
    [attr.aria-describedby]="_describedBy"
    [attr.aria-label]="lineNumberLabel"
    [attr.aria-invalid]="errorState"
    [attr.placeholder]="placeholder"
    [attr.aria-required]="required"
    [required]="required"
    [disabled]="disabled"
  />

  @if (readonly && !disabled) {
    <input
      #readonlyNumberInput
      class="c-input readonly-input"
      type="tel"
      [attr.readonly]="readonly || null"
      [attr.aria-readonly]="readonly || null"
      [value]="_getReadonlyValue()"
      [attr.aria-describedby]="_describedBy"
      [attr.aria-label]="lineNumberLabel"
      [attr.aria-invalid]="errorState"
    />
  }
</div>
