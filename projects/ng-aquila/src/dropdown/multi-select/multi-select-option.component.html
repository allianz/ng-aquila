<div
  class="nx-checkbox"
  [class.is-active]="active"
  [class.is-selected]="selected"
  [class.is-disabled]="disabled"
>
  <nx-checkbox-indicator
    class="nx-multi-select-option__indicator"
    [checked]="selected"
    [disabled]="disabled"
  ></nx-checkbox-indicator>

  <span class="nx-checkbox__label">
    {{ label() }}
  </span>
</div>
