<ng-template #content>
  @if (_table.viewType === 'desktop' || _table.viewType === 'tablet') {
    @if (type === 'header') {
      <th
        class="nx-comparison-table__cell nx-comparison-table__product-cell nx-comparison-table__header-cell"
        [class.is-disabled]="_isCellDisabled()"
        scope="col"
        role="columnheader"
        [class.is-selected]="_isSelected()"
        [class.has-popular-above]="_hasPopularAbove()"
        [class.is-hidden]="_isCellHidden()"
        [attr.id]="id"
        [attr.data-ct-col]="_visiblePosition()"
        [class.is-error]="_table.isError"
        [class.first]="_isFirst()"
        [class.last]="_isLast()"
        [class.is-stuck]="_table._isHeaderStuck()"
        [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
        [attr.data-nx-accent-color]="accentColor()"
      >
        <span
          class="nx-comparison-table__cell-inner"
          [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
          [attr.data-nx-accent-color]="accentColor()"
        >
          <ng-container *ngTemplateOutlet="ngContent"></ng-container>
        </span>
      </th>
    } @else {
      <td
        class="nx-comparison-table__cell nx-comparison-table__product-cell"
        [class.nx-comparison-table__footer-cell]="type === 'footer'"
        [class.is-disabled]="_isCellDisabled()"
        role="cell"
        [class.is-selected]="_isSelected()"
        [class.is-hidden]="_isCellHidden()"
        [class.is-faded]="_isOutsidePage()"
        [attr.id]="id"
        [attr.data-ct-col]="_visiblePosition()"
        [attr.headers]="_headerIds()"
        [class.is-error]="_table.isError"
        [class.first]="_isFirst()"
        [class.last]="_isLast()"
        [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
        [attr.data-nx-accent-color]="accentColor()"
      >
        <span
          class="nx-comparison-table__cell-inner"
          [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
          [attr.data-nx-accent-color]="accentColor()"
        >
          <ng-container *ngTemplateOutlet="ngContent"></ng-container>
        </span>
      </td>
    }
  }
  @if (_table.viewType === 'mobile') {
    <td
      class="nx-comparison-table__mobile-cell"
      [class.nx-comparison-table__mobile-header-cell]="type === 'header'"
      [class.nx-comparison-table__cell]="type !== 'header'"
      [class.nx-comparison-table__footer-cell]="type === 'footer'"
      [class.is-selected]="_isSelected()"
      [class.is-hidden]="_isCellHidden()"
      [attr.scope]="type === 'header' ? 'row' : ''"
      [attr.id]="id"
      [attr.headers]="_headerIds()"
      [class.is-error]="_table.isError"
      [class.first]="_isFirst()"
      [class.last]="_isLast()"
    >
      <ng-container *ngTemplateOutlet="ngContent"></ng-container>
    </td>
  }
</ng-template>

<ng-template #ngContent>
  @if (_showRadioIndicator()) {
    <span class="nx-comparison-table__radio-indicator" aria-hidden="true">
      <nx-radio-indicator
        [checked]="_isSelected()"
        [disabled]="_isCellDisabled()"
        [colorScheme]="_radioIndicatorColorScheme()"
      ></nx-radio-indicator>
    </span>
  }
  <!-- Never gate these on `type`: projection is resolved statically, so a slot inside an @if that
       doesn't render swallows its content instead of letting it fall through to the catch-all
       below. Gating dropped select buttons on footer cells and header slots on content cells. -->
  <ng-content select="nx-comparison-table-header-top"></ng-content>
  <ng-content select="nx-comparison-table-header-eyebrow"></ng-content>
  <ng-content select="nx-comparison-table-header-title"></ng-content>
  <ng-content select="nx-comparison-table-header-price"></ng-content>
  <ng-content select="button[nxComparisonTableSelectButton]"></ng-content>
  <ng-content></ng-content>
</ng-template>
