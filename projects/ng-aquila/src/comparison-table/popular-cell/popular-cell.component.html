<ng-template #content>
  @if (_table.viewType === 'desktop' || _table.viewType === 'tablet') {
    <td
      class="nx-comparison-table__popular-cell nx-comparison-table__product-cell"
      role="cell"
      [class.is-error]="_table.isError"
      [class.is-hidden]="_table._hiddenIndexSet().has(forColumn - 1)"
      [attr.id]="id"
      [style.--ct-col]="_table._visibleColumnIndex(forColumn - 1)"
      [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
      [attr.data-nx-accent-color]="surface() === 'default' ? null : accentColor()"
    >
      <span
        class="nx-comparison-table__popular-cell-inner"
        [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
        [attr.data-nx-accent-color]="surface() === 'default' ? null : accentColor()"
      >
        <ng-container *ngTemplateOutlet="ngContent"></ng-container>
      </span>
    </td>
  }
  @if (_table.viewType === 'mobile') {
    <td
      class="nx-comparison-table__mobile-popular-cell"
      [class.is-error]="_table.isError"
      [class.is-hidden]="_table._hiddenIndexSet().has(forColumn - 1)"
      [attr.id]="id"
      [attr.data-nx-surface]="surface() === 'default' ? null : surface()"
      [attr.data-nx-accent-color]="surface() === 'default' ? null : accentColor()"
    >
      <ng-container *ngTemplateOutlet="ngContent"></ng-container>
    </td>
  }
</ng-template>

<ng-template #ngContent>
  <ng-content></ng-content>
</ng-template>
