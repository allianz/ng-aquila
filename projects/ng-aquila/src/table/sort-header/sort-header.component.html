<div
  #focusContainer
  class="nx-sort-header__focus-container"
  role="button"
  tabindex="0"
  [title]="_getTitle()"
  aria-live="polite"
>
  <ng-content></ng-content>

  <div [attr.aria-label]="_getAriaLabel()" class="nx-sort-header__icon-container">
    @if (!_isSorted()) {
      <nx-icon name="popout" aria-hidden="true" />
    } @else if (_isSortedAscending()) {
      <nx-icon name="arrow-up" aria-hidden="true" />
    } @else if (_isSortedDescending()) {
      <nx-icon name="arrow-down" aria-hidden="true" />
    }
  </div>
</div>
