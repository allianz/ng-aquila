@if (_page(); as page) {
  <h1>{{ page.title }}</h1>

  @for (example of _examples(); track example.name) {
    <section class="example">
      <h2 class="example__name">{{ example.name }}</h2>
      <ng-container *ngComponentOutlet="example.component" />
    </section>
  }
} @else {
  <h1>Unknown page: {{ id() }}</h1>
}
